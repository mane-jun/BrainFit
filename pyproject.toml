[project]
name = "brainfit"
version = "0.1.0"
requires-python = ">=3.10"
description = "Muse 2 EEG baseline & cognitive-state analysis for BrainFit"

[tool.setuptools.packages.find]
include = ["brainfit*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::RuntimeWarning", "ignore::FutureWarning", "ignore::DeprecationWarning"]
